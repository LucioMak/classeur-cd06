<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classeur Formateur CD06</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8A1F3A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#F3F2EF;--ink:#1D1B1F;--muted:#6B6670;--acc:#8A1F3A;--card:#fff;--line:#DEDAD6}
@media (prefers-color-scheme:dark){:root{--bg:#141215;--ink:#F1EEF0;--muted:#A49DA6;--acc:#E07A93;--card:#1F1C20;--line:#36313A;color-scheme:dark}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.c img{width:84px;height:84px;margin:0 auto;border-radius:20px}
h1{font-size:20px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input{font:600 18px system-ui;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.04em}
button{font:700 16px system-ui;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
label{font-size:14px;color:var(--muted);display:flex;gap:8px;justify-content:center;align-items:center}
.err{color:#C4352B;font-weight:600;min-height:20px}
</style></head><body>
<form class="c" id="f"><img src="icon-192.png" alt=""><h1>Classeur Formateur CD06</h1><p>Accès réservé. Entre ton code.</p>
<input id="k" type="password" autocomplete="current-password" placeholder="Code d'accès" aria-label="Code d'accès" required>
<label><input type="checkbox" id="rm" checked style="width:auto;padding:0"> Rester connecté sur cet appareil</label>
<button type="submit">Ouvrir</button><div class="err" id="e" role="alert"></div></form>
<script>
const SALT="ZLoamk1hkGX/HjvdAwDy3g==",ITER=310000;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(code){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(SALT),iterations:ITER,hash:'SHA-256'},m,256)}
async function open_(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const r=await fetch('app.enc',{cache:'no-cache'});const b=new Uint8Array(await r.arrayBuffer());
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));return new TextDecoder().decode(pt)}
function launch(html){document.open();document.write(html);document.close()}
(async()=>{let s=null;try{s=localStorage.getItem('cd06key')||sessionStorage.getItem('cd06key')}catch(e){}
 if(s){try{launch(await open_(ub(s)))}catch(e){try{localStorage.removeItem('cd06key')}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const E=document.getElementById('e');E.textContent='Vérification…';
 try{const raw=await derive(document.getElementById('k').value.trim());const html=await open_(raw);const s=b64(raw);
  try{sessionStorage.setItem('cd06key',s);if(document.getElementById('rm').checked)localStorage.setItem('cd06key',s)}catch(e){}
  launch(html)}catch(e){E.textContent='Code incorrect.'}});
if('serviceWorker' in navigator&&!window.AndroidBridge)navigator.serviceWorker.register('sw.js');
</script></body></html>
