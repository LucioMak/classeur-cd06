name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copier l'appli dans l'APK
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W
          cp -r index.html app.enc docs lib icon-192.png icon-512.png apple-touch-icon.png manifest.webmanifest $W/
      - name: Construire
        run: gradle -p android assembleRelease -Pvc=${{ github.run_number }}
      - name: Publier
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Classeur-CD06.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Classeur-CD06.apk --title "Classeur CD06 - APK Android" --notes "Version ${{ github.run_number }}" --latest
