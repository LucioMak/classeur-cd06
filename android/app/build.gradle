plugins { id 'com.android.application' }
android {
  namespace 'fr.cd06kda.classeur'
  compileSdk 34
  defaultConfig {
    applicationId 'fr.cd06kda.classeur'
    minSdk 24
    targetSdk 34
    versionCode (project.findProperty('vc') ?: '1') as int
    versionName "1.${project.findProperty('vc') ?: '1'}"
  }
  signingConfigs {
    release {
      storeFile file('../release.jks')
      storePassword 'cd06classeur'
      keyAlias 'cd06'
      keyPassword 'cd06classeur'
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress += ['enc','jpg','pdf','js','html'] }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0'; implementation 'androidx.core:core:1.13.1' }
